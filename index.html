<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Configurações básicas -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título da página -->
    <title>Exemplo Exercício Desvio Condicional – Validação Número</title>

    <!-- Ligação com o CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Container principal -->
    <div class="container">

        <!-- Título -->
        <h1>Validação de Números</h1>

        <!-- Campo de entrada numérica -->
        <input 
            type="number" 
            id="numero" 
            placeholder="Digite um número"
        >

        <!-- Botão que chama a função JS -->
        <button onclick="validarNumero()">Validar</button>

        <!-- Parágrafo para exibir a mensagem -->
        <p id="mensagem"></p>

    </div>

    <!-- Ligação com o JavaScript -->
    <script src="script.js"></script>

</body>
</html>
